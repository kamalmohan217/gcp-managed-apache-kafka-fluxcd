apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ngf
  namespace: nginx-gateway
spec:
  interval: 10m0s
  chart:
    spec:
      chart: nginx-gateway-fabric
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway
        namespace: flux-system
  install:
    createNamespace: true
