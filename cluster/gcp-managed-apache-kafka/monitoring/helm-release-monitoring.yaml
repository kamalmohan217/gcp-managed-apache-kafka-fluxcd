apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m0s
#  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  values:
    grafana:
      serviceAccount:
        annotations:
          iam.gke.io/gcp-service-account: kafka-monitor-sa@wise-trainer-244916.iam.gserviceaccount.com
      additionalDataSources:
        - name: Google Cloud Monitoring
          type: stackdriver
          access: proxy
          jsonData:
            authenticationType: gce