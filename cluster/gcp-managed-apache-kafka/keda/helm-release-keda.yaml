kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 10m0s
#  targetNamespace: keda
  chart:
    spec:
      chart: keda
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  install:
    createNamespace: true
  upgrade:
